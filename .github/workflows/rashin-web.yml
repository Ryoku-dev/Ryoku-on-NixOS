name: Rashin web

on:
  pull_request:
    paths:
      - 'ryoku/rashin/web/**'
      - 'ryoku/rashin/backend/web/dist/**'
      - 'ryoku/shell/quickshell/shell/services/lib/chatstate.js'
      - '.github/workflows/rashin-web.yml'
  push:
    paths:
      - 'ryoku/rashin/web/**'
      - 'ryoku/rashin/backend/web/dist/**'
      - 'ryoku/shell/quickshell/shell/services/lib/chatstate.js'
      - '.github/workflows/rashin-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Rashin web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ryoku/rashin/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ryoku/rashin/web
        run: pnpm install --frozen-lockfile

      - name: Check types and Svelte
        working-directory: ryoku/rashin/web
        run: pnpm check

      - name: Run tests
        working-directory: ryoku/rashin/web
        run: pnpm test

      - name: Build dashboard
        working-directory: ryoku/rashin/web
        run: pnpm build

      - name: Verify committed dashboard
        shell: bash
        run: |
          if ! git diff --exit-code -- ryoku/rashin/backend/web/dist; then
            echo '::error::The committed Rashin dist is stale. Run pnpm build in ryoku/rashin/web and commit the updated dist.'
            exit 1
          fi
