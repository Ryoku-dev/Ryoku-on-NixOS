name: Ryotunes Nix

on:
  push:
    branches:
      - unstable-dev
      - feat/ryotunes-build-isolation
    paths:
      - flake.nix
      - flake.lock
      - nix/packages/default.nix
      - nix/modules/ryoku.nix
      - nix/apps/ryoku-install.nix
      - .github/workflows/ryotunes-nix.yml

  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/packages/default.nix
      - nix/modules/ryoku.nix
      - nix/apps/ryoku-install.nix
      - .github/workflows/ryotunes-nix.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryotunes-nix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Ryotunes packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - name: Validate Ryotunes packages
        shell: bash
        run: |
          set -euo pipefail

          version="$(nix eval --raw .#ryotunes-unwrapped.version)"
          test -n "$version"

          unwrapped="$(nix eval --raw .#ryotunes-unwrapped.drvPath)"
          wrapped="$(nix eval --raw .#ryoku-ryotunes.drvPath)"
          qml="$(nix eval --raw .#ryoku-qml.drvPath)"

          unwrapped_deps="$(nix-store -qR "$unwrapped")"
          wrapped_deps="$(nix-store -qR "$wrapped")"

          if grep -Fxq "$qml" <<< "$unwrapped_deps"; then
            printf 'Rust application unexpectedly depends on Ryoku QML.\\n' >&2
            exit 1
          fi

          if ! grep -Fxq "$qml" <<< "$wrapped_deps"; then
            printf 'Desktop wrapper is missing Ryoku QML.\\n' >&2
            exit 1
          fi

          nix build --dry-run --no-link .#ryoku-ryotunes

  publish:
    name: Build and cache Ryotunes
    needs: validate
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check cache configuration
        env:
          CACHE: ${{ vars.CACHIX_CACHE }}
          TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHE" || {
            printf 'Missing repository variable: CACHIX_CACHE\n' >&2
            exit 1
          }

          test -n "$TOKEN" || {
            printf 'Missing repository secret: CACHIX_AUTH_TOKEN\n' >&2
            exit 1
          }

      - name: Free build disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build standalone application
        id: application
        shell: bash
        run: |
          set -euo pipefail

          output="$(
            nix build \
              --no-link \
              --print-out-paths \
              -L \
              .#ryotunes-unwrapped
          )"

          # RyotunesNix ships no Tauri binary: the `ryotunes` launcher is
          # created by the wrapper, so it is checked below, not here.
          test -x "$output/bin/ryotunesd"
          test -x "$output/bin/ryotunes-cli"
          test -f "$output/share/ryotunes/client/shell.qml"

          printf 'path=%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Build Ryoku integration
        id: integration
        shell: bash
        run: |
          set -euo pipefail

          output="$(
            nix build \
              --no-link \
              --print-out-paths \
              -L \
              .#ryoku-ryotunes
          )"

          test -x "$output/bin/ryotunes"
          test -x "$output/bin/ryotunes-qml"
          test -x "$output/bin/ryotunesd"

          grep -q \
            'QML_IMPORT_PATH' \
            "$output/bin/ryotunes-qml"

          printf 'path=%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Publish completed packages
        env:
          CACHE: ${{ vars.CACHIX_CACHE }}
          APPLICATION: ${{ steps.application.outputs.path }}
          INTEGRATION: ${{ steps.integration.outputs.path }}
        run: |
          cachix push "$CACHE" \
            "$APPLICATION" \
            "$INTEGRATION"
