name: NixOS ISO build

# Every change on unstable-dev ends up in the ISO (it embeds the whole source
# tree), so this runs on every push instead of only on ISO paths.
on:
  push:
    branches:
      - unstable-dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-iso-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, boot and upload NixOS ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free build disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Boot the ISO in UEFI and BIOS VMs
        run: nix build -L --no-link .#checks.x86_64-linux.ryoku-iso-boot

      - name: Build the ISO
        id: iso
        shell: bash
        run: |
          set -euo pipefail

          # Images built from main follow main; everything else follows unstable-dev.
          output=ryoku-iso
          if [ "$GITHUB_REF_NAME" = main ]; then
            output=ryoku-iso-stable
          fi

          nix build -L --out-link result-iso ".#$output"

          iso="$(find -L result-iso/iso -maxdepth 1 -name '*.iso' -print -quit)"
          test -n "$iso"
          name="$(basename "$iso")"

          mkdir upload
          cp "$iso" "upload/$name"
          (cd upload && sha256sum "$name" > "$name.sha256")

          printf 'name=%s\n' "${name%.iso}" >> "$GITHUB_OUTPUT"
          {
            printf '### %s\n\n' "$name"
            printf 'Size: %s\n\n' "$(du -h "upload/$name" | cut -f1)"
            printf 'SHA-256: %s\n' "$(cut -d' ' -f1 "upload/$name.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso.outputs.name }}
          path: upload/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  cache:
    # Installs pull Ryoku's own packages from this cache instead of compiling
    # them; the installer and installed systems already trust it.
    if: github.event_name == 'push'
    name: Cache the default install closure
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check cache configuration
        env:
          CACHE: ${{ vars.CACHIX_CACHE }}
          TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHE" || {
            printf 'Missing repository variable: CACHIX_CACHE\n' >&2
            exit 1
          }

          test -n "$TOKEN" || {
            printf 'Missing repository secret: CACHIX_AUTH_TOKEN\n' >&2
            exit 1
          }

      - name: Free build disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache

          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the default install closure
        run: nix build -L --no-link .#ryoku-install-closure
