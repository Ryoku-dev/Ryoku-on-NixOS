name: Release Notes

# Publishes a GitHub Release from the Note: trailers authors wrote on their
# commits (see CONTRIBUTING.md and bin/ryoku-release-notes). A stable v* tag
# becomes an immutable release; each unstable-dev bump refreshes one rolling
# "unstable" pre-release holding everything landed since the last stable tag.
# A stable release is also announced to Discord (the DISCORD_WEBHOOK_URL secret,
# shared with discord-notifications.yml); the rolling unstable pre-release is not,
# to keep the channel quiet.
#
# stable-release.yml and unstable-version-bump.yml dispatch this explicitly,
# because tags and commits pushed with GITHUB_TOKEN do not fire push triggers.
# A hand-pushed v* tag still fires the push trigger below on its own.

on:
  push:
    branches:
      - unstable-dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: stable (a v* tag) or unstable (the rolling pre-release)
        type: choice
        options:
          - stable
          - unstable
        default: unstable
      ref:
        description: the v* tag for stable; a commit or branch for unstable
        required: false
        default: ''
      from:
        description: previous unstable commit for an incremental manual publish
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode and range
        id: cfg
        shell: bash
        run: |
          set -euo pipefail

          from=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            case "${{ github.ref }}" in
              refs/tags/*)
                mode="stable"
                ref="${{ github.ref_name }}"
                ;;
              *)
                mode="unstable"
                ref="$(git rev-parse HEAD)"
                from="${{ github.event.before }}"
                ;;
            esac
          else
            mode="${{ inputs.mode }}"
            ref="${{ inputs.ref }}"
            from="${{ inputs.from }}"
          fi
          [[ -n $ref ]] || ref="$(git rev-parse HEAD)"

          if [[ $mode == "unstable" ]]; then
            if [[ -z $from || $from =~ ^0+$ ]]; then
              if git rev-parse -q --verify 'refs/tags/unstable^{commit}' >/dev/null 2>&1; then
                from="$(git rev-parse 'refs/tags/unstable^{commit}')"
              else
                from="$(git rev-parse "${ref}^" 2>/dev/null || true)"
              fi
            fi
            if [[ -n $from ]] && ! git merge-base --is-ancestor "$from" "$ref" 2>/dev/null; then
              echo "::warning::Unstable notes baseline $from is not an ancestor of $ref; using the previous commit instead."
              from="$(git rev-parse "${ref}^" 2>/dev/null || true)"
            fi
          fi

          {
            echo "mode=$mode"
            echo "ref=$ref"
            echo "from=$from"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish the release
        shell: bash
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          REF: ${{ steps.cfg.outputs.ref }}
          FROM: ${{ steps.cfg.outputs.from }}
        run: |
          set -euo pipefail

          body="$(mktemp)"

          if [[ $MODE == "stable" ]]; then
            version="${REF#v}"
            # the most recent stable tag before this one bounds the range; a
            # first-ever release has none, so the notes span all history.
            from="$(git describe --tags --abbrev=0 --match 'v*' "${REF}^" 2>/dev/null || true)"
            # the line's name (CODENAME) titles the release; the first release
            # of a line opens with its story from release/names.md.
            name="$(git show "$REF:CODENAME" 2>/dev/null | tr -d '[:space:]' || true)"
            title="Ryoku ${name:+$name }${version}"
            intro="$(mktemp)"
            if [[ -n $name ]]; then
              prev_name=""
              [[ -n $from ]] && prev_name="$(git show "$from:CODENAME" 2>/dev/null | tr -d '[:space:]' || true)"
              if [[ $prev_name != "$name" ]]; then
                git show "$REF:release/names.md" 2>/dev/null \
                  | awk -v h="## $name" '$0 == h {on=1; next} /^## / {on=0} on && (NF || seen) {seen=1; print}' >"$intro"
              fi
            fi
            prerelease=""
            case "$version" in
              *alpha* | *beta* | *rc*) prerelease="--prerelease" ;;
            esac

            MEDIA_REF="$REF" ./bin/ryoku-release-notes "$from" "$REF" --title "$title" --intro "$intro" >"$body"

            if gh release view "$REF" >/dev/null 2>&1; then
              gh release edit "$REF" --title "$title" --notes-file "$body"
            else
              # shellcheck disable=SC2086
              gh release create "$REF" --title "$title" --notes-file "$body" --verify-tag $prerelease
            fi

            # Announce the stable release to Discord, reusing the existing webhook
            # secret. The message carries the published GitHub changelog verbatim
            # (its ### New/Fixed/Removed headings render natively in Discord) in a
            # branded embed with the wordmark banner. Stable only, so the rolling
            # unstable pre-release never floods the channel; non-fatal, so a
            # webhook hiccup can never fail the release.
            if [[ -n "${DISCORD_WEBHOOK_URL:-}" ]]; then
              release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$REF"
              raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/ryoku/assets/brand"
              footer="Ryoku Arch : For the sake of power and beauty."
              notes_file="$(mktemp)"
              # pull the changelog straight from the published GitHub release, so
              # Discord shows exactly what the release page shows.
              gh release view "$REF" --json body -q .body >"$notes_file" 2>/dev/null || cp "$body" "$notes_file"
              jq -n \
                --rawfile notes "$notes_file" \
                --arg title "$title" \
                --arg url "$release_url" \
                --arg raw "$raw" \
                --arg footer "$footer" \
                '($notes | gsub("\r"; "")) as $b
                 | (if ($b | length) > 3800
                      then $b[0:3800] + "\n\n**[Read the full changelog](" + $url + ")**"
                      else $b end) as $desc
                 | {
                     username: "Ryoku",
                     avatar_url: ($raw + "/logo-mark.png"),
                     allowed_mentions: { parse: [] },
                     content: ("**" + $title + " is now available.**"),
                     embeds: [ {
                       author: { name: "Ryoku Arch", icon_url: ($raw + "/logo-mark.png") },
                       title: $title,
                       url: $url,
                       description: $desc,
                       color: 8955261,
                       image: { url: ($raw + "/dark.png") },
                       thumbnail: { url: ($raw + "/logo-mark.png") },
                       footer: { text: $footer, icon_url: ($raw + "/logo-mark.png") },
                       timestamp: (now | todateiso8601)
                     } ]
                   }' >/tmp/discord.json
              rm -f "$notes_file"
              code="$(curl -sS -o /tmp/discord-resp.json -w '%{http_code}' \
                -H 'Content-Type: application/json' -X POST \
                --data-binary @/tmp/discord.json "$DISCORD_WEBHOOK_URL")"
              case "$code" in
                200 | 204) echo "Discord release announcement sent." ;;
                *) echo "::warning::Discord webhook returned HTTP $code"; cat /tmp/discord-resp.json 2>/dev/null || true ;;
              esac
            fi
          else
            # The rolling unstable release carries only this update's notes.
            # Recreating it still emits one release event for Discord, but old
            # patch notes are no longer replayed on every unstable push.
            to="$REF"
            from="$FROM"
            version="$(git show "$to:VERSION" 2>/dev/null | tr -d '[:space:]')"
            title="Ryoku ${version} (unstable)"

            MEDIA_REF="$to" ./bin/ryoku-release-notes "$from" "$to" --title "$title" >"$body"

            gh release delete unstable --cleanup-tag --yes 2>/dev/null || true
            gh release create unstable --title "$title" --notes-file "$body" --prerelease --target "$to"
          fi

          {
            echo "### Published release notes ($MODE)"
            echo
            cat "$body"
          } >>"$GITHUB_STEP_SUMMARY"
