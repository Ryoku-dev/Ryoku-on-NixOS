<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Rashin</title>
  <!-- The Rashin seal. 針 (needle) ends in 十, the cross, which is also the
       compass card at its four cardinals. The cross is cut from the Ryoku
       tile with its north-south stroke drawn as the needle: a lozenge with
       exact 15-degree flanks (apex y=40, waist 47 wide at y=128, foot y=216,
       overshooting the bar by 4 so the points read as long as the flat
       ends) and a 16-unit east-west bar (x 44..212). North is vermillion,
       the way a compass needle is painted; the pivot is the tile showing
       through. One-colour and small cuts live beside this file. -->
  <g id="symbol">
    <path id="tile" fill="#000000" d="M24 128 C24 48 48 24 128 24 C208 24 232 48 232 128 C232 208 208 232 128 232 C48 232 24 208 24 128 Z"/>
    <path id="north" fill="#e2342a" d="M128 40 L151.58 128 L104.42 128 Z"/>
    <path id="south" fill="#cdc4ba" d="M128 216 L104.42 128 L151.58 128 Z"/>
    <rect id="bar" fill="#cdc4ba" x="44" y="120" width="168" height="16"/>
    <circle id="pivot" fill="#000000" cx="128" cy="128" r="9"/>
  </g>
</svg>
