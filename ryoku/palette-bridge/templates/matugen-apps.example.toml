# install-integrations.sh maintains these sections in
# ~/.config/ryoku/palette-bridge/matugen.toml. Ryoku renders that file beside
# its shipped Matugen configs, so app setup never forks matugen/apps.toml.

[templates.vesktop]
input_path = "~/.local/share/ryoku/palette-bridge/templates/vesktop-colors.css"
output_path = "~/.local/state/ryoku/palette-bridge/vesktop/palette.css"
post_hook = "bash \"$HOME/.local/state/ryoku/palette-bridge/vesktop/quickcss.sh\" \"$HOME/.config/vesktop/settings/quickCss.css\" \"$HOME/.local/state/ryoku/palette-bridge/vesktop/palette.css\""

[templates.zen]
input_path = "~/.local/share/ryoku/palette-bridge/templates/zen.css"
output_path = "~/.config/zen/<ZEN_PROFILE>/chrome/ryoku-colors.css"
