# Merge these sections into Ryoku's user-owned Matugen apps.toml overlay.
# Replace <ZEN_PROFILE> with the active directory listed by about:profiles.
# Run install-integrations.sh --vesktop to install the merge helper first.

[templates.vesktop]
input_path = "~/.config/matugen/templates/vesktop-colors.css"
output_path = "~/.local/state/ryoku/palette-bridge/vesktop/palette.css"
post_hook = "bash \"$HOME/.local/state/ryoku/palette-bridge/vesktop/quickcss.sh\" \"$HOME/.config/vesktop/settings/quickCss.css\" \"$HOME/.local/state/ryoku/palette-bridge/vesktop/palette.css\""

[templates.zen]
input_path = "~/.config/matugen/templates/zen.css"
output_path = "~/.config/zen/<ZEN_PROFILE>/chrome/ryoku-colors.css"
