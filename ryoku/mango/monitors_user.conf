# Your display pins, loaded after the generated monitors.conf so what you set
# here wins. Never shipped over, never rewritten by the display tooling.
#
# One rule per output, keyed by the name `mmsg get all-monitors` prints:
#
#   monitorrule=name:eDP-1,mode:2560x1600@165.001,scale:1.6,x:0,y:0
#
# A panel that lies about its EDID usually needs the mode spelled out here.
