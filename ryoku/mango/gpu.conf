# Written at runtime by the GPU tooling, which pins the render device when a
# machine has more than one: wlroots picks the first DRM card by default, so
# on a hybrid laptop that is the weak iGPU and every effect renders there.
# The pin is one env line, set before mango starts and re-sourced on reload:
#
#   env=WLR_DRM_DEVICES,/dev/dri/card1
#
# Empty means mango chooses, which is right on a single-GPU box. Hand edits
# are lost on the next GPU reset; put yours in user.conf.
