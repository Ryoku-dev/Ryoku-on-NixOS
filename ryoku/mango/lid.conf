# The physical lid edge. mango reads its switch events natively and fires
# these once per transition; Ryoku adds only the shared docked-or-secure-
# suspend policy, the same call niri's switch-events block makes. The open
# event cancels any close retry without touching mango's output state.
#
# mango's own docs require the systemd inhibit for the lid to stay ignored
# (HandleLidSwitch=ignore, shipped by the base config), so the compositor is
# the only thing that sees the switch and ryoku-clamshell is the only policy.
switchbind=fold,spawn,ryoku-clamshell policy close
switchbind=unfold,spawn,ryoku-clamshell policy open
