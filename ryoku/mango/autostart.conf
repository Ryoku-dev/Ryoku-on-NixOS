# The login bootstrap: everything a Ryoku session must bring up when mango
# starts. Each entry is one shell command, run once when the compositor comes
# up, and every value here must stay under mango's 255-character line cap. The
# systemd session line is load-bearing; the rest are best-effort helpers, each
# guarded so a missing binary or a second login still lands a session.
#
# mango runs its own env push and starts mango-session.target internally
# before these lines fire, so the chain below races nothing: it is idempotent
# by design and carries the power-cutover gate the compositor's own line does
# not do.
#
# X11 has no line here on purpose: mango embeds Xwayland, creates the X11
# sockets and exports $DISPLAY itself. A manual start would race it.

# Keyring secrets + pkcs11 agents, before anything can ask for a stored secret.
# Idempotent: re-prints its env and exits when PAM already started it at login.
exec-once=gnome-keyring-daemon --start --components=secrets,pkcs11

exec-once=gsettings set org.gnome.desktop.interface color-scheme prefer-dark
# adw-gtk3-dark, not Adwaita-dark: stock Adwaita GTK3 hardcodes its colours,
# while adw-gtk3 derives from the named colours the daemon already emits. The
# daemon owns accent-color, so it is not set here.
exec-once=gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark

# Folder icons tinted to the wallpaper accent, rebuilt on every palette change.
exec-once=command -v ryoku-cmd-folders >/dev/null 2>&1 && ryoku-cmd-folders

# The session, in one chained command. Push the compositor env into the user
# manager first: a lost race skips ConditionEnvironment=WAYLAND_DISPLAY units
# and lands a black desktop. daemon-reload picks up freshly laid units, then
# session-start owns the guarded restarts and does not return until the shell
# and lid owners prove readiness. Portals restart last so a stale frontend
# cannot proxy ScreenCast requests to the dead backend.
exec-once=dbus-update-activation-environment --systemd --all; systemctl --user daemon-reload; ryoku-power-cutover session-start-logged && systemctl --user try-restart xdg-desktop-portal.service xdg-desktop-portal-gnome.service xdg-desktop-portal-gtk.service

# No autoscale line: mango's monitorrule handling plus ryoku-wm-mango outputs
# own the layout, and ryoku-monitor is the Hyprland provider's display tool.

# Per-device Bluetooth codec memory: WirePlumber restores a device's profile
# across reconnects but not its A2DP codec, so reconcile on every card event.
# A no-op for anyone who never chose a codec.
exec-once=command -v ryoku-bt-audio >/dev/null 2>&1 && ryoku-bt-audio watch

# Record the keyring mode once and seed a blank passwordless default, so no app
# prompts for a keyring password out of the box. Idempotent once a mode is set.
exec-once=command -v ryoku >/dev/null 2>&1 && ryoku keyring init

exec-once=command -v ryoku-gpu >/dev/null 2>&1 && ryoku-gpu persist
# Battery charge ceiling and PCIe link policy are plain sysfs values the kernel
# forgets across a reboot, so a stored choice is pushed back at login. A no-op
# with no power.json and on a box without the knobs.
exec-once=command -v ryoku-power >/dev/null 2>&1 && ryoku-power apply

# Push the stored lighting look back at adopted keyboards and mice. A no-op
# until lighting is on with a device adopted.
exec-once=command -v ryoku-hub >/dev/null 2>&1 && ryoku-hub lighting apply
exec-once=command -v ryoku-mic >/dev/null 2>&1 && ryoku-mic

# A touchpad locked off with the FN key stays off across logins (the lock lives
# in the generated settings mango reads), so name it once the shell can show a
# toast; a pad left off is never a mystery. A no-op when the pad is on. The
# sleep is load-bearing: exec-once runs before mango opens its IPC socket.
exec-once=command -v ryoku >/dev/null 2>&1 && sleep 8 && ryoku wm act input.touchpad restore login

# Restore the warm screen when night light was left on; the process a reboot
# drops. A no-op when it was off or absent.
exec-once=command -v ryoku-cmd-nightlight >/dev/null 2>&1 && ryoku-cmd-nightlight restore

# Booted into a btrfs snapshot from the boot menu: offer the one-click restore.
# mango runs no XDG autostart entries, so start it here; a normal boot detects
# no snapshot and exits silently.
exec-once=command -v limine-snapper-restore >/dev/null 2>&1 && limine-snapper-restore --notify

# Seed voxtype's config and user service with the built-in hotkey off (the shell
# owns Super+` and the mic wave); starts unless dictation was turned off in the
# Hub.
exec-once=command -v voxtype >/dev/null 2>&1 && command -v ryoku-hub >/dev/null 2>&1 && ryoku-hub voxtype ensure >/dev/null 2>&1

# Seed the empty AI-translation key file so Language > Generate with AI can read it.
exec-once=command -v ryoku-i18n >/dev/null 2>&1 && ryoku-i18n ensure >/dev/null 2>&1

# Welcome tour (once per tour version) and the first-boot keyboard hint
# (exactly once ever). The behaviour lives in ryoku-session-intro so every
# compositor's autostart calls the same script; mango's config grammar
# truncates a value at 255 characters, so an inline chain here would silently
# lose its tail. Bump the tour version in the helper when the tour changes.
exec-once=command -v ryoku-session-intro >/dev/null 2>&1 && ryoku-session-intro welcome
exec-once=command -v ryoku-session-intro >/dev/null 2>&1 && ryoku-session-intro keys-hint
