# Mango ships this file itself (default=gtk, ScreenCast/Screenshot=wlr,
# Inhibit=none) and ryoku-desktop-mango owns the copy: the mangowm package
# suppresses its own install of it so exactly one package lays each path.
# Screen sharing and screenshots ride the wlr backend; the GTK default covers
# the file picker everywhere. Inhibit=none keeps the compositor from asking a
# portal whether the session may idle, which is ryoku-idle's job.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
