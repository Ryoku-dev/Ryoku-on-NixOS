<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Python's own mark: a coiled snake, drawn for Ryoku. Consumers recolour it
     through a mask layer, so it stays a single solid path and the eye is a
     hole (the mark masks by alpha). -->
<svg
   width="1024"
   height="1024"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   id="svg1">
  <g id="mark" fill="none" stroke="#000000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- body: a coil tightening into the tail -->
    <path id="coil"
      d="M 128 216
         C 62 216 30 184 30 146
         C 30 108 62 84 104 84
         C 146 84 172 102 172 130
         C 172 156 152 170 128 170
         C 106 170 92 158 92 142
         C 92 128 102 120 114 120" />
    <!-- neck: the body lifts out of the coil toward the head -->
    <path id="neck" d="M 114 120 C 122 116 128 108 130 96" />
    <!-- head with an even-odd eye hole -->
    <path id="head" fill="#000000" stroke="none" fill-rule="evenodd"
      d="M 136 44 A 22 22 0 1 1 135.9 44 Z
         M 142 55 A 5 5 0 1 0 142.1 55 Z" />
    <path id="tongue" d="M 158 60 L 178 54 M 178 54 L 188 48 M 178 54 L 188 58" stroke-width="10" />
  </g>
</svg>
